<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القرآن الكريم</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  color: #222;
}

header {
  background: #087f5b;
  color: white;
  text-align: center;
  padding: 22px;
}

header h1 {
  margin: 0;
  font-size: 29px;
}

header p {
  margin: 8px 0 0;
}

.container {
  width: 95%;
  max-width: 900px;
  margin: 20px auto;
}

select,
input {
  width: 100%;
  padding: 14px;
  margin-bottom: 15px;
  border: 2px solid #087f5b;
  border-radius: 12px;
  font-size: 17px;
  background: white;
}

.title {
  color: #087f5b;
  font-size: 20px;
  font-weight: bold;
  margin: 15px 0;
}

.info {
  background: white;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 15px;
  text-align: center;
  box-shadow: 0 2px 8px #0001;
}

.surahs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 12px;
}

.surah {
  background: white;
  border: 0;
  border-radius: 12px;
  padding: 16px 10px;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 2px 8px #0001;
}

.surah:hover {
  background: #e9f7f1;
}

.number {
  display: block;
  color: #087f5b;
  font-size: 14px;
  margin-bottom: 5px;
}

.player {
  display: none;
  position: sticky;
  bottom: 10px;
  margin-top: 20px;
  padding: 18px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 3px 15px #0003;
  text-align: center;
}

.player h2 {
  color: #087f5b;
  margin-top: 0;
}

audio {
  width: 100%;
}

.close {
  margin-top: 10px;
  padding: 9px 20px;
  border: 0;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <h1>📖 القرآن الكريم</h1>
  <p>استمع إلى القرآن الكريم بأصوات أشهر القراء</p>
</header>

<div class="container">

<div class="title">🎙️ اختر القارئ</div>

<select id="reciter">

<option value="mishary">مشاري راشد العفاسي</option>
<option value="sudais">عبد الرحمن السديس</option>
<option value="maher">ماهر المعيقلي</option>
<option value="shuraim">سعود الشريم</option>
<option value="minshawi">محمد صديق المنشاوي</option>

<option value="husary">محمود خليل الحصري</option>
<option value="abdulbasit">عبد الباسط عبد الصمد</option>
<option value="mustafa">مصطفى إسماعيل</option>
<option value="banna">محمود علي البنا</option>
<option value="shatri">أبو بكر الشاطري</option>

<option value="dossary">ياسر الدوسري</option>
<option value="faris">فارس عباد</option>
<option value="ghamdi">سعد الغامدي</option>
<option value="ajmi">أحمد العجمي</option>
<option value="refai">هاني الرفاعي</option>

<option value="jalil">خالد الجليل</option>
<option value="qatami">ناصر القطامي</option>
<option value="abkar">إدريس أبكر</option>
<option value="jibril">محمد جبريل</option>
<option value="jaber">علي جابر</option>

</select>

<div id="info" class="info">
اختر القارئ واضغط على أي سورة
</div>

<input
id="search"
type="text"
placeholder="🔎 ابحث عن سورة..."
>

<div class="title">📖 السور</div>

<div id="surahs" class="surahs"></div>

<div id="player" class="player">

<h2 id="surahTitle"></h2>

<audio id="audio" controls></audio>

<br>

<button class="close" onclick="closePlayer()">
إغلاق
</button>

</div>

</div>

<script>

const surahs = [
"الفاتحة","البقرة","آل عمران","النساء","المائدة",
"الأنعام","الأعراف","الأنفال","التوبة","يونس",
"هود","يوسف","الرعد","إبراهيم","الحجر",
"النحل","الإسراء","الكهف","مريم","طه",
"الأنبياء","الحج","المؤمنون","النور","الفرقان",
"الشعراء","النمل","القصص","العنكبوت","الروم",
"لقمان","السجدة","الأحزاب","سبأ","فاطر",
"يس","الصافات","ص","الزمر","غافر",
"فصلت","الشورى","الزخرف","الدخان","الجاثية",
"الأحقاف","محمد","الفتح","الحجرات","ق",
"الذاريات","الطور","النجم","القمر","الرحمن",
"الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
"الصف","الجمعة","المنافقون","التغابن","الطلاق",
"التحريم","الملك","القلم","الحاقة","المعارج",
"نوح","الجن","المزمل","المدثر","القيامة",
"الإنسان","المرسلات","النبأ","النازعات","عبس",
"التكوير","الانفطار","المطففين","الانشقاق","البروج",
"الطارق","الأعلى","الغاشية","الفجر","البلد",
"الشمس","الليل","الضحى","الشرح","التين",
"العلق","القدر","البينة","الزلزلة","العاديات",
"القارعة","التكاثر","العصر","الهمزة","الفيل",
"قريش","الماعون","الكوثر","الكافرون","النصر",
"المسد","الإخلاص","الفلق","الناس"
];

/*
  السيرفرات
*/

const servers = {

mishary:
"https://server8.mp3quran.net/afs/",

sudais:
"https://server11.mp3quran.net/sds/",

maher:
"https://server12.mp3quran.net/maher/",

shuraim:
"https://server7.mp3quran.net/shur/",

minshawi:
"https://server10.mp3quran.net/minsh/",

husary:
"https://server13.mp3quran.net/husr/",

abdulbasit:
"https://server7.mp3quran.net/basit/",

mustafa:
"https://server8.mp3quran.net/mustafa/",

banna:
"https://server7.mp3quran.net/bna/",

shatri:
"https://server11.mp3quran.net/shatri/",

dossary:
"https://server11.mp3quran.net/yasser/",

faris:
"https://server8.mp3quran.net/frs_a/",

ghamdi:
"https://server17.mp3quran.net/s_gmd/",

ajmi:
"https://server10.mp3quran.net/ajm/",

refai:
"https://server8.mp3quran.net/hani/",

jalil:
"https://server10.mp3quran.net/jleel/",

qatami:
"https://server6.mp3quran.net/qtm/",

abkar:
"https://server6.mp3quran.net/abkar/",

jibril:
"https://server8.mp3quran.net/jbrl/",

jaber:
"https://server11.mp3quran.net/a_jbr/"
};

const names = {

mishary:"مشاري راشد العفاسي",
sudais:"عبد الرحمن السديس",
maher:"ماهر المعيقلي",
shuraim:"سعود الشريم",
minshawi:"محمد صديق المنشاوي",
husary:"محمود خليل الحصري",
abdulbasit:"عبد الباسط عبد الصمد",
mustafa:"مصطفى إسماعيل",
banna:"محمود علي البنا",
shatri:"أبو بكر الشاطري",
dossary:"ياسر الدوسري",
faris:"فارس عباد",
ghamdi:"سعد الغامدي",
ajmi:"أحمد العجمي",
refai:"هاني الرفاعي",
jalil:"خالد الجليل",
qatami:"ناصر القطامي",
abkar:"إدريس أبكر",
jibril:"محمد جبريل",
jaber:"علي جابر"

};

const reciter =
document.getElementById("reciter");

const info =
document.getElementById("info");

const surahsBox =
document.getElementById("surahs");

const search =
document.getElementById("search");

const player =
document.getElementById("player");

const audio =
document.getElementById("audio");

const surahTitle =
document.getElementById("surahTitle");


function showSurahs(list = surahs) {

surahsBox.innerHTML = "";

list.forEach(function(name) {

const number =
surahs.indexOf(name) + 1;

const button =
document.createElement("button");

button.className = "surah";

button.innerHTML =
`<span class="number">
سورة ${number}
</span>
${name}`;

button.onclick =
function() {

playSurah(number,name);

};

surahsBox.appendChild(button);

});

}


function updateInfo() {

info.innerHTML =
"🎙️ <b>" +
names[reciter.value] +
"</b><br>" +
"اضغط على أي سورة لتشغيلها";

}


function playSurah(number,name) {

const code =
String(number).padStart(3,"0");

const url =
servers[reciter.value] +
code +
".mp3";

surahTitle.innerHTML =
"سورة " +
name +
"<br><small>" +
names[reciter.value] +
"</small>";

audio.src = url;

player.style.display = "block";

audio.load();

audio.play().catch(function(){

console.log("اضغط تشغيل");

});

player.scrollIntoView({
behavior:"smooth",
block:"center"
});

}


function closePlayer() {

audio.pause();

audio.removeAttribute("src");

audio.load();

player.style.display = "none";

}


reciter.addEventListener(
"change",
updateInfo
);


search.addEventListener(
"input",
function(){

const text =
search.value.trim();

if(text === ""){

showSurahs();

return;

}

const result =
surahs.filter(function(name){

return name.includes(text);

});

showSurahs(result);

});


updateInfo();

showSurahs();

</script>

</body>
</html>
